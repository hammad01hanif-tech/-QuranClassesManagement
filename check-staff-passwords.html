<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فحص كلمات سر الموظفين</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 32px;
      max-width: 800px;
      margin: 0 auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #0f172a;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .summary-card {
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      border: 2px solid;
    }

    .summary-card .count {
      font-size: 28px;
      font-weight: 700;
      display: block;
      margin-bottom: 4px;
    }

    .summary-card .label {
      font-size: 13px;
      font-weight: 600;
    }

    .summary-card.custom {
      background: #f0fdf4;
      border-color: #86efac;
      color: #15803d;
    }

    .summary-card.default-pass {
      background: #fffbeb;
      border-color: #fcd34d;
      color: #b45309;
    }

    .summary-card.total {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin: 20px 0 10px;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .section-title.needs {
      background: #fffbeb;
      color: #b45309;
      border-right: 4px solid #f59e0b;
    }

    .section-title.done {
      background: #f0fdf4;
      color: #15803d;
      border-right: 4px solid #22c55e;
    }

    .staff-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .staff-item {
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      gap: 12px;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 10px;
      align-items: center;
      font-size: 14px;
    }

    .staff-item .staff-id {
      font-family: monospace;
      font-weight: 700;
      color: #475569;
      direction: ltr;
      text-align: left;
    }

    .staff-item .staff-name {
      font-weight: 600;
      color: #0f172a;
    }

    .staff-item .staff-role {
      font-size: 12px;
      color: #64748b;
      background: #e2e8f0;
      padding: 3px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #64748b;
      font-size: 15px;
    }

    .error-box {
      background: #fef2f2;
      border: 2px solid #fca5a5;
      color: #b91c1c;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      display: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>فحص كلمات سر الموظفين</h1>
    <p class="subtitle">مقارنة موظفي قاعدة البيانات مع قائمة كلمات السر المعرفة في النظام</p>

    <div id="loadingState" class="loading">جاري تحميل البيانات من قاعدة البيانات...</div>

    <div id="resultsArea" style="display:none;">
      <div class="summary-cards">
        <div class="summary-card total">
          <span class="count" id="totalCount">0</span>
          <span class="label">إجمالي الموظفين</span>
        </div>
        <div class="summary-card custom">
          <span class="count" id="customCount">0</span>
          <span class="label">لديهم كلمة سر خاصة</span>
        </div>
        <div class="summary-card default-pass">
          <span class="count" id="defaultCount">0</span>
          <span class="label">على كلمة السر الافتراضية</span>
        </div>
      </div>

      <div class="section-title needs">يستخدمون كلمة السر الافتراضية (t12345) — يحتاجون كلمة سر خاصة:</div>
      <div class="staff-list" id="defaultList"></div>

      <div class="section-title done">لديهم كلمة سر خاصة:</div>
      <div class="staff-list" id="customList"></div>
    </div>

    <div class="error-box" id="errorBox"></div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Firebase Configuration (نفس الإعدادات من firebase-config.js)
    const firebaseConfig = {
      apiKey: "AIzaSyD7ESB0tCrlcRGVVOUxhRxnRd3KFVG0J_I",
      authDomain: "quraan-classes.firebaseapp.com",
      projectId: "quraan-classes",
      storageBucket: "quraan-classes.firebasestorage.app",
      messagingSenderId: "357726085982",
      appId: "1:357726085982:web:8e55ede16af33e28bac8b8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // كلمات السر المعرفة حالياً في main.js - يجب تحديثها يدوياً إذا تغيرت
    const customPasswords = {
      'ANS01': true,
      'IBR01': true,
      'OSM01': true,
      'HRT01': true,
      'BDR01': true,
      'JHD01': true,
      'SLM01': true,
      'SMM01': true,
      'AMR01': true,
      'ABD01': true,
      'OMR01': true,
      'FAD01': true,
      'MZB01': true,
      'MZN01': true,
      'MOT': true,
      'NBL01': true,
      'FSL01': true,
      'ABM01': true,
      'HMD01': true,
      'JWD01': 'excluded' // منقطع - لا يحتاج رقم سري
    };

    const roleNames = {
      'teacher': 'معلم',
      'admin': 'إداري',
      'viewer': 'مشرف',
      'supervisor': 'مشرف'
    };

    async function checkStaffPasswords() {
      try {
        const snapshot = await getDocs(collection(db, 'classes'));

        if (snapshot.empty) {
          showError('لا يوجد موظفين في قاعدة البيانات');
          return;
        }

        const withCustom = [];
        const withDefault = [];

        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const staffId = docSnap.id;
          const name = data.teacherName || data.presenterName || data.adminName || data.className || 'بدون اسم';
          const role = data.role || 'غير محدد';

          const status = customPasswords[staffId];

          const item = { id: staffId, name, role };

          if (status === true) {
            withCustom.push(item);
          } else if (status === 'excluded') {
            // مستثنى (منقطع) - لا نظهره في أي قائمة
          } else {
            withDefault.push(item);
          }
        });

        // ترتيب أبجدي
        const sortByName = (a, b) => a.name.localeCompare(b.name, 'ar');
        withCustom.sort(sortByName);
        withDefault.sort(sortByName);

        // عرض النتائج
        document.getElementById('totalCount').textContent = withCustom.length + withDefault.length;
        document.getElementById('customCount').textContent = withCustom.length;
        document.getElementById('defaultCount').textContent = withDefault.length;

        renderList('defaultList', withDefault);
        renderList('customList', withCustom);

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('resultsArea').style.display = 'block';

      } catch (error) {
        console.error(error);
        showError('حدث خطأ أثناء جلب البيانات: ' + error.message);
      }
    }

    function renderList(elementId, items) {
      const container = document.getElementById(elementId);

      if (items.length === 0) {
        container.innerHTML = '<div class="staff-item" style="grid-template-columns: 1fr; text-align:center; color:#94a3b8;">لا يوجد</div>';
        return;
      }

      container.innerHTML = items.map(item => `
        <div class="staff-item">
          <div class="staff-id">${item.id}</div>
          <div class="staff-name">${item.name}</div>
          <div class="staff-role">${roleNames[item.role] || item.role}</div>
        </div>
      `).join('');
    }

    function showError(message) {
      document.getElementById('loadingState').style.display = 'none';
      const box = document.getElementById('errorBox');
      box.textContent = message;
      box.style.display = 'block';
    }

    checkStaffPasswords();
  </script>
</body>
</html>
